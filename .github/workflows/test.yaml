name: Run Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync --locked

    - name: Run prek hooks
      run: uvx prek run --all-files --show-diff-on-failure

    - name: Run pytest
      run: uv run pytest
