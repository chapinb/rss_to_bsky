name: Build and Push Docker Image

on:
  push:
    branches:
    - main
    tags:
    - v*
  # Build (without pushing) on pull requests so a broken image is caught
  # before it reaches main.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: rsstobsky

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          # main -> latest, v1.2.3 -> 1.2.3, PRs -> pr-N (never pushed).
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=ref,event=pr
          labels: |
            runnumber=${{ github.run_id }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache: PR builds reuse layers cached by main, so the
          # dependency layers (incl. compiled wheels) are only rebuilt when
          # pyproject.toml / uv.lock change.
          cache-from: type=gha
          cache-to: type=gha,mode=max
