[project]
name = "rss-post"
version = "0.1.0"
description = "Posts City of Norwalk, CT meetings, news and local stories to Bluesky"
readme = "README.md"
authors = [
    { name = "Chapin Bryce", email = "mail@chapinb.com" }
]
requires-python = ">=3.11"
dependencies = [
    "atproto>=0.0.73",
    "beautifulsoup4>=4.15.0",
    "feedparser>=6.0.14",
    "libmuni>=0.1.0",
    "python-decouple>=3.8",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest-watcher>=0.6.3",
    "pytest>=9.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rss_post"]

[tool.uv]
package = true

[project.scripts]
norwalk = "rss_post.norwalk_feeds:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
